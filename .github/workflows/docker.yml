name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ vars.DOCKER_USERNAME }}/demo-backend:latest \
            ./server

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL=https://demo-backend-latest-ndae.onrender.com/api/demo \
            -t ${{ vars.DOCKER_USERNAME }}/demo-frontend:latest \
            ./client

      - name: Push backend Docker image
        run: |
          docker push ${{ vars.DOCKER_USERNAME }}/demo-backend:latest

      - name: Push frontend Docker image
        run: |
          docker push ${{ vars.DOCKER_USERNAME }}/demo-frontend:latest
